const URL='https://adbpxqyjbqrquoqqjqst.supabase.co',KEY='sb_publishable_x5fuOEW_J-UHLyKSPnighg_TbZdbUce';const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let posts=[],current=null,comments=[],pendingImages=[],marketType='give';
async function rpc(fn,obj={}){const r=await fetch(URL+'/rest/v1/rpc/'+fn,{method:'POST',headers:{apikey:KEY,'Content-Type':'application/json'},body:JSON.stringify(obj)});const t=await r.text();let d;try{d=JSON.parse(t)}catch{d=t}if(!r.ok)throw Error(d?.message||d?.error||t);return d}
function toast(t){$('toast').textContent=t;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),2800)}function modal(html){$('modalContent').innerHTML=html;const bg=$('modalbg');bg.style.removeProperty('display');bg.classList.add('show')}function closeSharingModal(){const bg=$('modalbg');if(!bg)return;bg.classList.remove('show');bg.style.display='none';pendingImages=[];}const state={available:'나눔 가능',reserved:'예약 중',completed:'나눔 완료'};const imgUrl=p=>p.images?.[0]?URL+'/storage/v1/object/public/sharing-images/'+p.images[0]:'';
function normalizeOpenChat(raw){const s=String(raw||'').trim();if(!s)return null;let u;try{u=new globalThis.URL(s)}catch(_){throw Error('오픈채팅 링크는 https://open.kakao.com/o/ 로 시작해야 합니다.')}if(u.protocol!=='https:'||u.hostname!=='open.kakao.com'||!/^\/o\/[A-Za-z0-9_-]+\/?$/.test(u.pathname)||u.username||u.password||u.port)throw Error('카카오톡 오픈채팅 참여 링크(https://open.kakao.com/o/...)만 입력해 주세요.');return u.origin+u.pathname}

function setMarketType(t){marketType=t;document.getElementById('tabGive').classList.toggle('active',t==='give');document.getElementById('tabWant').classList.toggle('active',t==='want');document.getElementById('marketExplain').textContent=t==='give'?'사용하지 않는 물품을 다른 교당·교도님께 나누는 게시판입니다.':'필요한 물품을 요청하는 게시판입니다. 물품을 나눠주실 수 있는 분은 댓글이나 도움 제안을 남겨 주세요.';document.getElementById('search').placeholder=t==='give'?'나눔 물품 검색':'요청 물품 검색';render()}
async function load(){try{posts=await rpc('sharing_list');render()}catch(e){$('cards').innerHTML='<div class="empty">게시판 설치 또는 연결 확인이 필요합니다.<p>'+esc(e.message)+'</p></div>'}}
function render(){const q=$('search').value.trim().toLowerCase();const arr=posts.filter(p=>(p.postType||'give')===marketType&&(p.title+' '+p.description+' '+p.affiliation).toLowerCase().includes(q));$('cards').innerHTML=arr.map(p=>`<article class="item" data-id="${p.id}"><div class="image">${imgUrl(p)?`<img loading="lazy" src="${esc(imgUrl(p))}" alt="물품 사진">`:'♡'}</div><div class="cardbody"><span class="tag ${p.status}">${(p.postType==='want'?{available:'요청 중',reserved:'연결 중',completed:'요청 완료'}:state)[p.status]||'나눔'}</span><h3>${esc(p.title)}</h3><div class="meta">${esc(p.author)} · ${esc(p.affiliation)}<br>${esc(p.region||'지역 협의')} · 댓글 ${p.comments||0}개${p.chatUrl?'<br>💬 오픈카톡으로 대화 가능':''}</div></div></article>`).join('')||'<div class="empty">'+(marketType==='want'?'등록된 나눔 요청이 없습니다.<p>필요한 물품을 요청해 보세요.</p>':'등록된 나눔 물품이 없습니다.<p>첫 번째 나눔을 시작해 보세요.</p>')+'</div>';$('cards').querySelectorAll('[data-id]').forEach(x=>x.onclick=()=>detail(x.dataset.id))}
const field=(name,label,value='',type='text',extra='')=>`<label>${label}<input name="${name}" type="${type}" value="${esc(value)}" ${extra} required></label>`;
function openEditor(p=null){pendingImages=[];modal(`<h2>${p?'게시글 수정':'나눔장터 글 등록'}</h2><form id="editForm" class="form"><label class="full">게시글 종류 *<select name="postType" id="postTypeSelect" onchange="syncTypeFields()"><option value="give">나눔합니다 (물품 제공)</option><option value="want">나눔 요청합니다 (물품 요청)</option></select></label>${field('name','속명(법명) *',p?.author||'')}${field('affiliation','소속 *',p?.affiliation||'')}${field('title','물품명 *',p?.title||'')}<label>나눔 상태<select name="status"><option value="available">나눔 가능</option><option value="reserved">예약 중</option><option value="completed">나눔 완료</option></select></label>${field('region','지역',p?.region||'협의')}${field('delivery','전달 방법',p?.delivery||'협의')}${field('quantity','수량',p?.quantity||1,'number','min="1" max="9999"')}<label class="full">물품 설명 *<textarea name="description" rows="5" required minlength="5">${esc(p?.description||'')}</textarea></label><label class="full">사진 등록 (최대 3장 · 자동 압축)<input type="file" id="photos" accept="image/*" multiple ${p?'disabled':''}></label><div class="sub full">${p?'게시글 수정 시 사진은 유지됩니다.':'사진은 최대 3장까지 등록할 수 있습니다. 업로드 시 크기를 자동 조절합니다.'}</div><label class="full">카카오톡 오픈채팅 링크 (선택·등록 권장)<input type="url" name="chatUrl" placeholder="https://open.kakao.com/o/xxxxxxxx" value="${esc(p?.chatUrl||'')}" maxlength="500" inputmode="url"></label><div class="openchat-guide full"><strong>💬 전화번호 없이 나눔 이야기를 나눠보세요!</strong><br>아래 버튼을 눌러 카카오톡 오픈채팅으로 이동하세요. 카카오톡에서 <b>1:1 오픈채팅</b>을 만든 뒤 초대 링크를 복사해 위에 붙여넣으시면 됩니다.<br><a href="https://open.kakao.com/" target="_blank" rel="noopener noreferrer" aria-label="카카오톡 공식 오픈채팅 열기">💬 오픈카톡 개설하러 가기 ↗</a><div class="openchat-hint">① 카카오톡 열기·로그인 → ② 오픈채팅 만들기 → ③ 1:1 채팅방 선택 → ④ 링크 복사 후 이곳에 붙여넣기<br>※ 카카오톡 환경에 따라 앱에서 직접 개설해야 할 수 있으며, 버튼만으로 채팅방이 자동 생성되지는 않습니다.</div><div class="openchat-hint">오픈채팅방은 나눔 연락용으로 만들고, 개인 연락처·주소·계좌번호는 공개하지 마세요. 게시글에는 공개된 참여 링크가 표시됩니다.</div></div>${field('password',p?'게시글 비밀번호 (수정 인증) *':'게시글 비밀번호 (수정·삭제용) *','','password','minlength="8" maxlength="128" autocomplete="new-password"')}<div class="actions full"><button type="button" data-sharing-close="true">닫기</button><button class="primary" type="submit">${p?'수정 저장':'나눔 등록'}</button></div></form>`);$('editForm').elements.postType.value=p?.postType||marketType;$('editForm').status.value=p?.status||'available';syncTypeFields();$('editForm').onsubmit=e=>save(e,p)}
function syncTypeFields(){const f=$('editForm');if(!f)return;const want=f.elements.postType.value==='want';const title=f.elements.title.closest('label');if(title)title.firstChild.textContent=want?'필요한 물품명 *':'나눔 물품명 *';const st=f.elements.status;st.options[0].text=want?'요청 중':'나눔 가능';st.options[1].text=want?'연결 중':'예약 중';st.options[2].text=want?'요청 완료':'나눔 완료';}
async function compress(file){const bmp=await createImageBitmap(file);let max=1250;let sc=Math.min(1,max/Math.max(bmp.width,bmp.height));let quality=.8;let blob;for(let i=0;i<9;i++){const can=document.createElement('canvas');can.width=Math.max(1,Math.round(bmp.width*sc));can.height=Math.max(1,Math.round(bmp.height*sc));can.getContext('2d').drawImage(bmp,0,0,can.width,can.height);blob=await new Promise(ok=>can.toBlob(ok,'image/webp',quality));if(blob&&blob.size<=295000)break;quality=Math.max(.42,quality-.09);sc*=.86}bmp.close();if(!blob||blob.size>307200)throw Error('사진을 300KB 이하로 압축할 수 없습니다.');return new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=reject;r.readAsDataURL(blob)})}
async function uploadPhoto(id,password,data){const r=await fetch(URL+'/functions/v1/share-image',{method:'POST',headers:{apikey:KEY,'Content-Type':'application/json'},body:JSON.stringify({postId:id,password,image:data})});const j=await r.json();if(!r.ok)throw Error(j.error||'사진 업로드 실패');return j}
async function save(e,p){e.preventDefault();const btn=e.submitter;btn.disabled=true;try{const f=new FormData(e.target),pw=f.get('password'),files=[...($('photos')?.files||[])];if(files.length>3)throw Error('사진은 최대 3장입니다.');const chatUrl=normalizeOpenChat(f.get('chatUrl'));const args={p_id:p?.id||null,p_name:f.get('name'),p_affiliation:f.get('affiliation'),p_title:f.get('title'),p_description:f.get('description'),p_region:f.get('region'),p_delivery:f.get('delivery'),p_quantity:Number(f.get('quantity')),p_password:pw,p_status:f.get('status'),p_images:p?.images||[]};const id=await rpc('sharing_post_save_chat',{...args,p_post_type:f.get('postType'),p_chat_url:chatUrl});let failures=[];for(const file of files){try{await uploadPhoto(id,pw,await compress(file))}catch(err){failures.push(err.message)}}closeSharingModal();await load();if(failures.length)alert('게시글은 저장됐지만 사진 업로드 일부가 실패했습니다.\n'+failures.join('\n'));else toast(p?'게시글이 수정되었습니다.':'나눔 글이 등록되었습니다.');await detail(id)}catch(err){alert(err.message)}finally{btn.disabled=false}}
async function detail(id){current=posts.find(p=>p.id===id);if(!current)return;try{comments=await rpc('sharing_comments_list',{p_post_id:id})}catch(e){comments=[];toast('댓글을 불러올 수 없습니다.')}const p=current;modal(`<div style="display:flex;justify-content:space-between;gap:10px;align-items:start"><div><span class="tag ${p.status}">${(p.postType==='want'?{available:'요청 중',reserved:'연결 중',completed:'요청 완료'}:state)[p.status]}</span><div class="market-type ${p.postType==='want'?'want':''}">${p.postType==='want'?'나눔 요청합니다':'나눔합니다'}</div><h2 style="margin:12px 0">${esc(p.title)}</h2><div class="meta">${esc(p.author)} · ${esc(p.affiliation)} · ${new Date(p.createdAt).toLocaleDateString('ko-KR')}</div></div><button data-sharing-close="true" type="button">✕</button></div><div style="display:flex;gap:7px;margin:18px 0;overflow-x:auto">${(p.images||[]).map(path=>`<img src="${esc(URL+'/storage/v1/object/public/sharing-images/'+path)}" style="width:150px;height:130px;object-fit:cover;border-radius:10px">`).join('')||'<div class="note">등록된 사진이 없습니다.</div>'}</div><p class="desc">${esc(p.description)}</p><p class="meta">수량 ${p.quantity}개 · 지역 ${esc(p.region)} · 전달 ${esc(p.delivery)} · 보관 만료 ${new Date(p.expiresAt).toLocaleDateString('ko-KR')}</p><div class="openchat-guide" style="margin-top:14px">${p.chatUrl?'<strong>💬 나눔 문의는 오픈채팅으로 편하게 연락하세요.</strong><div class="openchat-hint">버튼을 누르면 카카오톡 오픈채팅방으로 이동합니다. 카카오톡 계정이 필요할 수 있습니다.</div>':'<strong>오픈채팅 링크가 없는 게시글입니다.</strong><div class="openchat-hint">아래 문의 댓글 또는 나눔 신청을 이용해 주세요.</div>'}</div><div class="actions" style="justify-content:flex-start;margin-top:12px">${chatButton(p)}</div><div class="actions"><button onclick="editCurrent()">수정</button><button class="danger" onclick="removePost()">삭제</button><button onclick="ownerRequests()">신청 내역 확인</button><button class="primary" ${p.status!=='available'?'disabled':''} onclick="requestForm()">${p.postType==='want'?'도움 제안':'나눔 신청'}</button></div><hr style="border:0;border-top:1px solid #e3e9e3;margin:24px 0"><h3>문의 댓글 · 답글 <span class="sub">${comments.length}</span></h3><div id="commentList"></div><div class="actions"><button class="primary" onclick="commentForm(null)">문의 댓글 작성</button></div>`);renderComments()}
function renderComments(){const byParent=new Map();comments.forEach(c=>{const key=c.parentId||'root';byParent.set(key,[...(byParent.get(key)||[]),c])});const draw=(c,depth=0)=>`<div class="comment ${depth?'reply':''}"><div class="top">${depth?'↳ ':''}${esc(c.author)} · ${esc(c.affiliation)}</div><p>${esc(c.content)}</p><div class="meta">${new Date(c.createdAt).toLocaleString('ko-KR')}</div><button onclick="commentForm('${c.id}')">답글</button><button onclick="deleteComment('${c.id}')">삭제</button></div>${(byParent.get(c.id)||[]).map(r=>draw(r,1)).join('')}`;$('commentList').innerHTML=(byParent.get('root')||[]).map(c=>draw(c)).join('')||'<p class="sub">아직 댓글이 없습니다.</p>'}
function backAfter(){detail(current.id)}
function credentialsForm(title,fields,onSubmit){modal(`<h2>${title}</h2><form id="auxForm" class="form">${fields}${field('password','비밀번호 *','','password','minlength="8" maxlength="128"')}<div class="actions full"><button type="button" onclick="backAfter()">돌아가기</button><button type="submit" class="primary">확인</button></div></form>`);$('auxForm').onsubmit=async e=>{e.preventDefault();const b=e.submitter;b.disabled=true;try{await onSubmit(new FormData(e.target))}catch(x){alert(x.message)}finally{b.disabled=false}}}
function editCurrent(){openEditor(current)}function removePost(){const p=current;credentialsForm('게시글 삭제',`<div class="note full">‘${esc(p.title)}’와 모든 댓글·신청 내역이 삭제됩니다. 사진 파일은 보관 정리 작업에서 삭제됩니다.</div>`,async f=>{if(!confirm('정말 영구 삭제하시겠습니까?'))return;await rpc('sharing_post_delete',{p_id:p.id,p_password:f.get('password')});closeSharingModal();await load();toast('게시글이 삭제되었습니다.')})}
function commentForm(parent){credentialsForm(parent?'답글 작성':'댓글 작성',`${field('name','속명(법명) *')}${field('affiliation','소속 *')}<label class="full">댓글 내용 *<textarea name="content" required maxlength="1000" rows="4"></textarea></label>`,async f=>{await rpc('sharing_comment_add',{p_post_id:current.id,p_parent_id:parent,p_name:f.get('name'),p_affiliation:f.get('affiliation'),p_content:f.get('content'),p_password:f.get('password')});toast('댓글이 등록되었습니다.');await load();await detail(current.id)})}
function deleteComment(id){credentialsForm('댓글 삭제',`<p class="note full">댓글 작성 시 지정한 비밀번호를 입력해 주세요. 답글이 달려 있는 경우 관련 답글도 삭제됩니다.</p>`,async f=>{await rpc('sharing_comment_delete',{p_id:id,p_password:f.get('password')});await load();await detail(current.id);toast('댓글이 삭제되었습니다.')})}
function requestForm(){credentialsForm(current?.postType==='want'?'도움 제안':'나눔 신청',`${field('name','속명(법명) *')}${field('affiliation','소속 *')}${field('contact','연락받을 전화번호 또는 이메일 *')}<label class="full">신청·제안 내용<textarea name="message" rows="3" maxlength="1000"></textarea></label><div class="note full">등록된 오픈카톡 링크가 있다면 게시글의 ‘오픈카톡으로 대화하기’ 버튼으로 개인정보를 입력하지 않고 먼저 대화할 수 있습니다. 이 신청서에 입력한 연락처는 게시글 작성자가 비밀번호 인증 후에만 확인할 수 있습니다.</div>`,async f=>{await rpc('sharing_request_add',{p_post_id:current.id,p_name:f.get('name'),p_affiliation:f.get('affiliation'),p_contact:f.get('contact'),p_message:f.get('message'),p_password:f.get('password')});await detail(current.id);toast(current?.postType==='want'?'도움 제안이 접수되었습니다.':'나눔 신청이 접수되었습니다.')})}
function ownerRequests(){credentialsForm(current?.postType==='want'?'도움 제안 확인':'나눔 신청자 확인',`<p class="note full">게시글 등록 시 지정한 비밀번호를 입력해 주세요. 신청자 연락처는 게시글 작성자만 확인할 수 있습니다.</p>`,async f=>{const arr=await rpc('sharing_requests_owner',{p_post_id:current.id,p_password:f.get('password')});modal(`<h2>${current?.postType==='want'?'도움 제안 내역':'나눔 신청 내역'}</h2>${arr.map(r=>`<div class="panel" style="margin-bottom:8px"><b>${esc(r.name)} · ${esc(r.affiliation)}</b><p class="meta">${esc(r.contact)}</p><p>${esc(r.message)}</p><span class="sub">${new Date(r.createdAt).toLocaleString('ko-KR')}</span></div>`).join('')||'<p class="note">아직 신청자가 없습니다.</p>'}<div class="actions"><button onclick="backAfter()">돌아가기</button></div>`)})}
// Dynamically rendered buttons: event delegation works regardless of current editor type.
document.addEventListener('click',function(e){
  const button=e.target.closest('[data-sharing-close]');
  if(!button)return;
  e.preventDefault();e.stopPropagation();
  closeSharingModal();
},true);
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&$('modalbg').classList.contains('show')){e.preventDefault();closeSharingModal();}});
$('modalbg').addEventListener('click',e=>{if(e.target===$('modalbg'))toast('작성 중인 내용 보호를 위해 닫기 버튼을 이용해 주세요.')});load();
</script><script id="sharingUsabilityUpgrade">(function(){
const saved=localStorage.getItem('sharing-large-text')==='yes';if(saved)document.body.classList.add('easy-mode');
const head=document.querySelector('header .links')||document.querySelector('header');
if(head){const b=document.createElement('button');b.type='button';b.className='easy-switch';b.textContent=saved?'기본 글씨':'큰 글씨';b.setAttribute('aria-pressed',saved?'true':'false');b.onclick=()=>{const on=document.body.classList.toggle('easy-mode');localStorage.setItem('sharing-large-text',on?'yes':'no');b.textContent=on?'기본 글씨':'큰 글씨';b.setAttribute('aria-pressed',String(on))};head.appendChild(b)}
const strip=document.createElement('div');strip.className='safety-strip';strip.innerHTML='<b>처음 이용하시나요?</b> 물품을 나누거나 요청할 때 속명(법명)·소속을 입력해 주세요. 댓글은 공개되므로 전화번호·주소를 쓰지 마세요. 문제가 있는 글은 <a href="mailto:?subject='+encodeURIComponent('[은혜 나눔장터] 게시글 신고')+'">이메일로 신고</a>할 수 있습니다. (신고 수신처는 운영자가 설정 필요)';
const main=document.querySelector('main');if(main)main.prepend(strip);
window.addEventListener('error',e=>{try{const v=JSON.parse(sessionStorage.getItem('sharing-errors')||'[]');v.push({time:new Date().toISOString(),message:String(e.message).slice(0,200)});sessionStorage.setItem('sharing-errors',JSON.stringify(v.slice(-30)))}catch(_){}});
})();</script></body></html>
